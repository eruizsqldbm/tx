version: 2

models:
  - name: dim_customer
    description: Customer dimension table storing customer details and segmentation data.
    config:
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns:
          - customer_id
        name: pk_dim_customer
    columns:
      - name: customer_id
        data_type: string
        description: Unique customer identifier (primary key).
        constraints:
          - type: not_null
      - name: first_name
        data_type: string
        description: Customer first name.
      - name: last_name
        data_type: string
        description: Customer last name.
      - name: email
        data_type: string
        description: Customer email address.
      - name: phone
        data_type: string
        description: Customer phone number.
      - name: address
        data_type: string
        description: Street address.
      - name: city
        data_type: string
        description: City of the customer.
      - name: state
        data_type: string
        description: State or province of the customer.
      - name: postal_code
        data_type: string
        description: Postal or ZIP code.
      - name: country
        data_type: string
        description: Customer country.
      - name: customer_segment
        data_type: string
        description: Customer segment (e.g., Retail, Corporate).

  - name: dim_date
    description: Date dimension table providing date-level attributes for time-based analysis.
    config:
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns:
          - date_key
        name: pk_dim_date
    columns:
      - name: date_key
        data_type: date
        description: Unique identifier for the date (primary key).
        constraints:
          - type: not_null
      - name: full_date
        data_type: string
        description: Formatted date (e.g., "2025-04-14").
      - name: day_of_week
        data_type: string
        description: Name of the weekday (e.g., "Monday").
      - name: day
        data_type: int
        description: Day of the month (1-31).
      - name: week
        data_type: int
        description: ISO week number of the year.
      - name: month
        data_type: int
        description: Month number (1-12).
      - name: month_name
        data_type: string
        description: Full month name (e.g., "January").
      - name: quarter
        data_type: int
        description: Calendar quarter (1-4).
      - name: year
        data_type: int
        description: Four-digit year.
      - name: is_weekend
        data_type: boolean
        description: Flag to indicate if the date falls on a weekend.

  - name: dim_employee
    description: Employee dimension table with personnel and organizational role data.
    config:
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns:
          - employee_id
        name: pk_dim_employee
    columns:
      - name: employee_id
        data_type: string
        description: Unique employee identifier (primary key).
        constraints:
          - type: not_null
      - name: first_name
        data_type: string
        description: Employee first name.
      - name: last_name
        data_type: string
        description: Employee last name.
      - name: email
        data_type: string
        description: Employee email address.
      - name: phone
        data_type: string
        description: Employee contact number.
      - name: hire_date
        data_type: date
        description: Date when the employee was hired.
      - name: job_title
        data_type: string
        description: Employee job title or role.
      - name: department
        data_type: string
        description: Department the employee works in.
      - name: manager_id
        data_type: string
        description: Manager or supervisor ID (if applicable).

  - name: dim_product
    description: Product dimension table containing product attributes for sales analysis.
    config:
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns:
          - product_id
        name: pk_dim_product
    columns:
      - name: product_id
        data_type: string
        description: Unique product identifier (primary key).
        constraints:
          - type: not_null
      - name: product_name
        data_type: string
        description: Name of the product.
      - name: category
        data_type: string
        description: Product category (e.g., Electronics).
      - name: sub_category
        data_type: string
        description: Sub-category within the main category.
      - name: brand
        data_type: string
        description: Brand of the product.
      - name: size
        data_type: string
        description: Size specification (if applicable).
      - name: color
        data_type: string
        description: Color of the product.
      - name: unit_price
        data_type: number(10,2)
        description: Standard unit price for the product.

  - name: dim_store
    description: Store dimension table representing physical and online store locations.
    config:
      contract:
        enforced: true
    constraints:
      - type: primary_key
        columns:
          - store_id
        name: pk_dim_store
    columns:
      - name: store_id
        data_type: string
        description: Unique store identifier (primary key).
        constraints:
          - type: not_null
      - name: store_name
        data_type: string
        description: Name of the store.
      - name: store_type
        data_type: string
        description: Store type (e.g., Physical, Online).
      - name: address
        data_type: string
        description: Store address.
      - name: city
        data_type: string
        description: City where the store is located.
      - name: state
        data_type: string
        description: State or province of the store.
      - name: postal_code
        data_type: string
        description: ZIP or postal code of the store.
      - name: country
        data_type: string
        description: Country where the store operates.
      - name: region
        data_type: string
        description: Geographical region (e.g., North America, EMEA).

  - name: fact_sales
    description: Fact table that records all sales transactions, referencing associated dimensions for analytics.
    config:
      contract:
        enforced: true
    constraints:
      - type: foreign_key
        columns:
          - store_id
        expression: dim_store (store_id)
        name: fk_fact_sales_store
      - type: foreign_key
        columns:
          - employee_id
        expression: dim_employee (employee_id)
        name: fk_fact_sales_employee
      - type: foreign_key
        columns:
          - product_id
        expression: dim_product (product_id)
        name: fk_fact_sales_product
      - type: primary_key
        columns:
          - sales_id
          - date_key
          - customer_id
          - product_id
          - store_id
          - employee_id
        name: pk_fact_sales
      - type: foreign_key
        columns:
          - customer_id
        expression: dim_customer (customer_id)
        name: fk_fact_sales_customer
      - type: foreign_key
        columns:
          - date_key
        expression: dim_date (date_key)
        name: fk_fact_sales_date
    columns:
      - name: sales_id
        data_type: string
        description: Unique identifier for each sales transaction (primary key).
        constraints:
          - type: not_null
      - name: date_key
        data_type: date
        description: Foreign key to dim_date.
        constraints:
          - type: not_null
      - name: customer_id
        data_type: string
        description: Foreign key to dim_customer.
        constraints:
          - type: not_null
      - name: product_id
        data_type: string
        description: Foreign key to dim_product.
        constraints:
          - type: not_null
      - name: store_id
        data_type: string
        description: Foreign key to dim_store.
        constraints:
          - type: not_null
      - name: employee_id
        data_type: string
        description: Foreign key to dim_employee.
        constraints:
          - type: not_null
      - name: quantity_sold
        data_type: int
        description: Number of product units sold.
      - name: unit_price
        data_type: number(10,2)
        description: Unit price at time of sale.
      - name: discount
        data_type: number(5,2)
        description: Discount applied on the transaction.
      - name: total_amount
        data_type: number(12,2)
        description: Final sale amount after discount.
      - name: profit
        data_type: number(14,2)
        description: Profit earned from the transaction.

